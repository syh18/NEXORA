<style>

button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}
.app{min-height:100vh}.sidebar{position:fixed;z-index:20;left:0;top:0;bottom:0;width:var(--sidebar);background:linear-gradient(180deg,#181a30,#202542);color:#fff;padding:18px 14px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:7px 8px 20px}.brandLogo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:grid;place-items:center;font-weight:900;overflow:hidden}.brandLogo img{width:100%;height:100%;object-fit:cover}.brand b{font-size:16px}.brand small{display:block;color:#9ea4c0;margin-top:2px}
.workspace{background:#ffffff0c;border:1px solid #ffffff12;border-radius:13px;padding:11px;margin:0 0 14px}.workspaceLabel{font-size:10px;color:#9097b5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.switchBtn{width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;color:#fff;border:0;text-align:left;padding:0}.switchMain{min-width:0}.switchMain b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.switchMain span{display:block;color:#9ea4c0;font-size:11px;margin-top:2px}
.nav{display:grid;gap:3px;overflow:auto}.navGroup{font-size:10px;color:#7f87a7;text-transform:uppercase;letter-spacing:.08em;padding:12px 11px 5px}.nav button{border:0;background:transparent;color:#b8bdd1;padding:11px 12px;border-radius:10px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:650}.nav button:hover,.nav button.active{color:#fff;background:#ffffff0d}.nav button.active{box-shadow:inset 3px 0 0 var(--primary)}.nav .ico{width:19px;text-align:center}.sideBottom{margin-top:auto;border-top:1px solid #ffffff12;padding-top:12px}.profile{display:flex;align-items:center;gap:10px;padding:8px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);display:grid;place-items:center;font-size:12px;font-weight:800}.profile b{display:block;font-size:12px}.profile span{font-size:10px;color:#969db9}
.main{margin-left:var(--sidebar);min-height:100vh;padding:25px 30px 40px;max-width:1600px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.pageTitle h1{margin:0;font-size:27px;letter-spacing:-.6px}.pageTitle p{margin:5px 0 0;color:var(--muted)}.topActions{display:flex;align-items:center;gap:9px}.iconBtn,.ghost,.primary,.dangerBtn{border-radius:10px;padding:10px 13px;border:1px solid var(--line);background:var(--surface);color:var(--text)}.iconBtn{width:40px;height:40px;padding:0}.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent;font-weight:800;box-shadow:0 8px 20px rgba(99,91,255,.2)}.dangerBtn{color:var(--danger)}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.muted{color:var(--muted)}.small{font-size:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.kpi{padding:17px}.kpiTop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.kpiIcon{width:34px;height:34px;border-radius:10px;background:var(--primarySoft);color:var(--primary);display:grid;place-items:center}.kpi b{display:block;font-size:24px;margin-top:13px;letter-spacing:-.5px}.kpi small{display:block;margin-top:5px;color:var(--muted)}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.sectionHead h2,.sectionHead h3{margin:0}.sectionHead p{margin:4px 0 0}.list{display:grid;gap:9px}.listItem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}.listMain{display:flex;align-items:center;gap:11px;min-width:0}.miniIcon{width:38px;height:38px;border-radius:11px;background:var(--primarySoft);color:var(--primary);display:grid;place-items:center;font-weight:800;flex:0 0 auto}.listMain b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.listMain span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:99px;background:var(--primarySoft);color:var(--primary);font-size:10px;font-weight:800}.badge.green{background:#e8f8f0;color:var(--success)}.badge.orange{background:#fff3df;color:var(--warning)}.badge.red{background:#ffedf0;color:var(--danger)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.bar h2{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{width:min(360px,100%);padding:11px 13px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;outline:0}.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px #635bff18}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 11px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.table td{font-size:13px}.table tr:last-child td{border-bottom:0}.formGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:var(--muted)}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);outline:0}textarea{resize:vertical}.modalBg{position:fixed;inset:0;z-index:50;background:#0b0d18aa;backdrop-filter:blur(5px);display:grid;place-items:center;padding:18px}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 25px 80px #0004}.modalHead{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.modalHead h3{margin:0;font-size:20px}.close{border:0;background:var(--surface2);color:var(--text);width:34px;height:34px;border-radius:9px}.modalFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.hidden{display:none!important}.empty{padding:35px 15px;text-align:center;color:var(--muted)}.companyCard{position:relative;overflow:hidden}.companyCard .companyTop{display:flex;gap:13px;align-items:center}.companyLogo{width:50px;height:50px;border-radius:14px;background:var(--primarySoft);color:var(--primary);display:grid;place-items:center;font-size:18px;font-weight:900;overflow:hidden}.companyLogo img{width:100%;height:100%;object-fit:cover}.companyCard h3{margin:0}.companyCard p{margin:4px 0 0;color:var(--muted);font-size:12px}.companyMeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.companyFoot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}.roleCard{padding:15px}.roleCard h3{margin:0}.perm{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.switchRow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.switchRow:last-child{border-bottom:0}.toggle{position:relative;width:43px;height:24px;background:#cfd2dc;border-radius:99px;border:0;padding:0}.toggle i{position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.18s}.toggle.on{background:var(--primary)}.toggle.on i{left:22px}.colorChoices{display:flex;gap:9px;flex-wrap:wrap}.colorDot{width:31px;height:31px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}.colorDot.selected{box-shadow:0 0 0 2px var(--text)}.logoUpload{border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center}.logoPreview{width:72px;height:72px;border-radius:18px;background:var(--primarySoft);margin:0 auto 9px;display:grid;place-items:center;overflow:hidden;font-weight:900;color:var(--primary)}.logoPreview img{width:100%;height:100%;object-fit:cover}.notice{padding:13px 14px;border-radius:12px;background:var(--primarySoft);color:var(--primary);font-size:12px;line-height:1.5}.mobileNav{display:none}.toast{position:fixed;right:20px;bottom:20px;z-index:80;background:#171a27;color:#fff;padding:12px 15px;border-radius:11px;box-shadow:0 12px 30px #0003;transform:translateY(12px);opacity:0;pointer-events:none;transition:.2s}.toast.show{transform:none;opacity:1}
@media(max-width:1050px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{display:none}.main{margin:0;padding:17px 14px 84px}.topbar{align-items:flex-start}.pageTitle h1{font-size:22px}.pageTitle p{font-size:12px}.topActions .desktopOnly{display:none}.grid4,.grid3,.grid2,.formGrid{grid-template-columns:1fr}.mobileNav{display:flex;position:fixed;z-index:40;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 5px;justify-content:space-around}.mobileNav button{border:0;background:transparent;color:var(--muted);font-size:10px;padding:7px 9px}.mobileNav button.active{color:var(--primary);font-weight:800}.bar{align-items:flex-start;flex-direction:column}.bar .actions{width:100%}.bar .search{width:100%}.table th,.table td{padding:11px 9px}.modal{padding:18px}.workspace{display:block}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modalBg" class="modalBg hidden"></div>

<script>
const KEY='nexora_v1';
const roles={
 Owner:{desc:'Akses penuh ke seluruh bisnis',color:'green',perms:['Dashboard','Perusahaan','Cabang','Pengguna','Kasir','Produk','Keuangan','Analitik','Pengaturan']},
 Manajer:{desc:'Mengelola operasional dan performa',color:'orange',perms:['Dashboard','Cabang','Pengguna','Kasir','Produk','Keuangan','Analitik']},
 Kasir:{desc:'Fokus pada transaksi penjualan',color:'blue',perms:['Dashboard','Kasir','Transaksi']},
 Marketing:{desc:'Fokus pada penjualan dan analitik',color:'blue',perms:['Dashboard','Kasir','Analitik']},
 Gudang:{desc:'Fokus pada stok dan produk',color:'orange',perms:['Dashboard','Produk','Stok']}
};
const navItems=[
 {id:'dashboard',icon:'⌂',label:'Dashboard',group:'Utama'},
 {id:'companies',icon:'▦',label:'Perusahaan',group:'Bisnis'},
 {id:'branches',icon:'⌖',label:'Cabang',group:'Bisnis'},
 {id:'users',icon:'♙',label:'Pengguna & Role',group:'Bisnis'},
 {id:'pos',icon:'▣',label:'Kasir',group:'Operasional'},
 {id:'products',icon:'◈',label:'Produk & Layanan',group:'Operasional'},
 {id:'finance',icon:'◫',label:'Keuangan',group:'Analitik'},
 {id:'analytics',icon:'◔',label:'Analitik',group:'Analitik'},
 {id:'settings',icon:'⚙',label:'Personalisasi',group:'Sistem'}
];
function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function seed(){
 const c1={id:id(),name:'Kopi Senja',type:'Barang + Jasa',logo:'',phone:'08123456789',email:'hello@kopisenja.id',address:'Surabaya, Jawa Timur',tax:11};
 const c2={id:id(),name:'Syarief Digital',type:'Jasa',logo:'',phone:'',email:'',address:'Surabaya, Jawa Timur',tax:0};
 const b1={id:id(),companyId:c1.id,name:'Surabaya',code:'SBY',address:'Jl. Raya Surabaya',phone:'',status:true};
 const b2={id:id(),companyId:c1.id,name:'Malang',code:'MLG',address:'Jl. Ijen, Malang',phone:'',status:true};
 const b3={id:id(),companyId:c2.id,name:'Kantor Utama',code:'HQ',address:'Surabaya',phone:'',status:true};
 return {
  companies:[c1,c2],branches:[b1,b2,b3],
  users:[
   {id:id(),name:'Syarief',email:'owner@nexora.id',role:'Owner',companyIds:[c1.id,c2.id],branchIds:[b1.id,b2.id,b3.id],status:true},
   {id:id(),name:'Andi',email:'manager@kopisenja.id',role:'Manajer',companyIds:[c1.id],branchIds:[b1.id,b2.id],status:true},
   {id:id(),name:'Rina',email:'kasir@kopisenja.id',role:'Kasir',companyIds:[c1.id],branchIds:[b1.id],status:true}
  ],
  products:[
   {id:id(),companyId:c1.id,name:'Kopi Susu Gula Aren',type:'Produk',category:'Coffee',price:22000,cost:7900,stock:40},
   {id:id(),companyId:c1.id,name:'Matcha Latte',type:'Produk',category:'Non-Coffee',price:26000,cost:10000,stock:20},
   {id:id(),companyId:c1.id,name:'Chicken Rice Bowl',type:'Produk',category:'Food',price:32000,cost:12000,stock:12},
   {id:id(),companyId:c2.id,name:'Social Media Management',type:'Layanan',category:'Marketing',price:2500000,cost:900000,stock:0}
  ],
  transactions:[
   {id:id(),companyId:c1.id,branchId:b1.id,total:485000,date:new Date().toISOString()},
   {id:id(),companyId:c1.id,branchId:b1.id,total:720000,date:new Date(Date.now()-86400000).toISOString()},
   {id:id(),companyId:c1.id,branchId:b2.id,total:530000,date:new Date(Date.now()-86400000).toISOString()}
  ],
  expenses:[
   {id:id(),companyId:c1.id,branchId:b1.id,name:'Bahan baku',amount:175000,date:new Date().toISOString()},
   {id:id(),companyId:c1.id,branchId:b1.id,name:'Operasional',amount:90000,date:new Date(Date.now()-86400000).toISOString()}
  ],
  currentUserId:null,currentCompanyId:c1.id,currentBranchId:b1.id,
  theme:{dark:false,color:'#635bff',compact:false}
 };
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
if(!S.currentUserId)S.currentUserId=S.users[0]?.id;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function currentUser(){return S.users.find(x=>x.id===S.currentUserId)||S.users[0]}
function currentCompany(){return S.companies.find(x=>x.id===S.currentCompanyId)||S.companies[0]}
function currentBranch(){return S.branches.find(x=>x.id===S.currentBranchId)||S.branches.find(x=>x.companyId===currentCompany()?.id)}
function companyBranches(cid){return S.branches.filter(x=>x.companyId===cid)}
function allowed(item){const u=currentUser();if(!u)return false;if(u.role==='Owner')return true;return roles[u.role]?.perms.includes(item)}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}
function initials(s){return String(s||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function modal(title,body,foot){document.getElementById('modalBg').innerHTML='<div class="modal"><div class="modalHead"><div><h3>'+title+'</h3></div><button class="close" onclick="closeModal()">×</button></div>'+body+(foot?'<div class="modalFoot">'+foot+'</div>':'')+'</div>';document.getElementById('modalBg').classList.remove('hidden')}
function closeModal(){document.getElementById('modalBg').classList.add('hidden');document.getElementById('modalBg').innerHTML=''}
let page='dashboard',search='';
function go(p){if(!allowed(navItems.find(x=>x.id===p)?.label||p))return toast('Role ini tidak memiliki akses');page=p;render()}
function setCompany(cid){S.currentCompanyId=cid;const b=companyBranches(cid);if(!b.some(x=>x.id===S.currentBranchId))S.currentBranchId=b[0]?.id;save();render();toast('Perusahaan aktif diubah')}
function setBranch(bid){S.currentBranchId=bid;save();render();toast('Cabang aktif diubah')}
function switchUser(uid){S.currentUserId=uid;const u=currentUser();const valid=S.companies.filter(c=>u.companyIds.includes(c.id));if(!valid.some(c=>c.id===S.currentCompanyId))S.currentCompanyId=valid[0]?.id;const bs=companyBranches(S.currentCompanyId).filter(b=>u.branchIds.includes(b.id));if(!bs.some(b=>b.id===S.currentBranchId))S.currentBranchId=bs[0]?.id;save();render();toast('Mode pengguna: '+u.role)}
function applyTheme(){document.body.classList.toggle('dark',!!S.theme.dark);document.documentElement.style.setProperty('--primary',S.theme.color||'#635bff');document.documentElement.style.setProperty('--primary2',lighten(S.theme.color||'#635bff'))}
function lighten(hex){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return '#'+[r,g,b].map(v=>Math.min(255,Math.round(v+45)).toString(16).padStart(2,'0')).join('')}
function shell(){
 const u=currentUser(),c=currentCompany(),b=currentBranch();
 const groups=[...new Set(navItems.map(x=>x.group))];
 document.getElementById('app').innerHTML='<aside class="sidebar"><div class="brand"><div class="brandLogo">'+(c?.logo?'<img src="'+c.logo+'">':'N')+'</div><div><b>NEXORA</b><small>Smart Business</small></div></div>'+
 '<div class="workspace"><div class="workspaceLabel">Workspace</div><button class="switchBtn" onclick="workspaceModal()"><div class="switchMain"><b>'+esc(c?.name||'Pilih perusahaan')+'</b><span>'+esc(b?.name||'Pilih cabang')+' · '+esc(u?.role||'')+'</span></div><span>⌄</span></button></div>'+
 '<nav class="nav">'+groups.map(g=>'<div class="navGroup">'+g+'</div>'+navItems.filter(x=>x.group===g&&allowed(x.label)).map(x=>'<button class="'+(page===x.id?'active':'')+'" onclick="go(\''+x.id+'\')"><span class="ico">'+x.icon+'</span>'+x.label+'</button>').join('')).join('')+'</nav>'+
 '<div class="sideBottom"><div class="profile"><div class="avatar">'+initials(u?.name)+'</div><div><b>'+esc(u?.name||'User')+'</b><span>'+esc(u?.role||'')+'</span></div></div></div></aside>'+
 '<main class="main"><div class="topbar"><div class="pageTitle"><h1>'+esc(navItems.find(x=>x.id===page)?.label||'Dashboard')+'</h1><p>'+esc(c?.name||'')+' · '+esc(b?.name||'')+'</p></div><div class="topActions"><button class="iconBtn" onclick="workspaceModal()" title="Ganti workspace">⌂</button><button class="iconBtn desktopOnly" onclick="go(\'settings\')" title="Pengaturan">⚙</button></div></div><div id="content"></div></main><nav class="mobileNav">'+navItems.filter(x=>allowed(x.label)).slice(0,5).map(x=>'<button class="'+(page===x.id?'active':'')+'" onclick="go(\''+x.id+'\')"><div>'+x.icon+'</div>'+x.label+'</button>').join('')+'</nav>';
 applyTheme();({dashboard,companies,branches,users,pos,products,finance,analytics,settings}[page]||dashboard)();
}
function workspaceModal(){
 const u=currentUser();const cs=S.companies.filter(c=>u.companyIds.includes(c.id));const c=currentCompany();const bs=companyBranches(c?.id).filter(b=>u.branchIds.includes(b.id));
 modal('Pilih Workspace','<div class="sectionHead"><div><h3>Perusahaan</h3><p class="muted small">Pilih bisnis yang sedang kamu kelola.</p></div><button class="primary" onclick="closeModal();companyForm()">+ Tambah</button></div><div class="list">'+cs.map(x=>'<button class="listItem" style="width:100%;text-align:left;color:inherit" onclick="setCompany(\''+x.id+'\');closeModal()"><div class="listMain"><div class="miniIcon">'+initials(x.name)+'</div><div><b>'+esc(x.name)+'</b><span>'+esc(x.type)+'</span></div></div>'+(x.id===S.currentCompanyId?'<span class="badge green">Aktif</span>':'')+'</button>').join('')+'</div><div style="height:18px"></div><div class="sectionHead"><div><h3>Cabang</h3><p class="muted small">Pilih lokasi operasional.</p></div><button class="ghost" onclick="closeModal();branchForm()">+ Cabang</button></div><div class="list">'+bs.map(x=>'<button class="listItem" style="width:100%;text-align:left;color:inherit" onclick="setBranch(\''+x.id+'\');closeModal()"><div class="listMain"><div class="miniIcon">⌖</div><div><b>'+esc(x.name)+'</b><span>'+esc(x.code||'')+'</span></div></div>'+(x.id===S.currentBranchId?'<span class="badge green">Aktif</span>':'')+'</button>').join('')+'</div>')
}
function dashboard(){
 const c=currentCompany(),b=currentBranch(), tx=S.transactions.filter(x=>x.companyId===c?.id&&(x.branchId===b?.id)),ex=S.expenses.filter(x=>x.companyId===c?.id&&(x.branchId===b?.id));
