<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA — Smart Business & POS</title>
<style>
:root{--g:#635bff;--g2:#eeedff;--bg:#f6f7fb;--card:#fff;--ink:#15172b;--muted:#73778c;--line:#e7e8f0;--red:#d94b62;--shadow:0 14px 40px rgba(30,34,80,.07);--dark:#171a2d;--soft:#f0f1f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{display:flex;min-height:100vh}.side{width:250px;background:linear-gradient(180deg,#191b32 0%,#202442 100%);color:#e9eafd;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{display:flex;gap:11px;align-items:center;padding:8px 10px 24px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#635bff,#8a7fff);color:#fff;display:grid;place-items:center;overflow:hidden;font-weight:900}.logo img{width:100%;height:100%;object-fit:contain}.brand b{display:block;font-size:16px}.brand small{color:#9da2bd}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#b5b9cf;text-align:left;padding:12px 13px;border-radius:10px}.nav button:hover,.nav button.on{background:linear-gradient(90deg,#635bff22,#ffffff08);color:#fff;box-shadow:inset 3px 0 0 #635bff}.main{margin-left:250px;width:calc(100% - 230px);padding:25px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:25px}.top p{margin:5px 0 0;color:var(--muted)}.pill{padding:7px 11px;border-radius:99px;background:var(--g2);color:var(--g);font-weight:800;font-size:12px}.pos{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px}.search{background:#fff;border:1px solid var(--line);padding:13px 15px;border-radius:12px;width:100%;outline:0}.chips{display:flex;gap:7px;overflow:auto;padding:12px 0}.chips button{padding:8px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);white-space:nowrap}.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pc{background:linear-gradient(180deg,#fff,#fbfbfe);border:1px solid var(--line);border-radius:14px;padding:17px;text-align:left;min-height:120px;box-shadow:var(--shadow)}.pc:hover{transform:translateY(-3px);box-shadow:0 16px 32px rgba(30,34,80,.10)}.pc b,.pc span,.pc small{display:block}.pc b{font-size:15px;margin-bottom:14px}.pc span{font-weight:900}.pc small{color:var(--muted);margin-top:7px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--shadow)}.cart{position:sticky;top:20px;height:max-content}.carthead,.bar,.row,.sum .line{display:flex;align-items:center;justify-content:space-between;gap:10px}.carthead{margin-bottom:12px}.carthead h3{margin:0}.mu{color:var(--muted);font-size:12px}.ci{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.qt{display:flex;gap:7px;align-items:center}.qt button{width:27px;height:27px;border-radius:8px;background:#edf1ef}.sum{margin-top:13px;border-top:1px solid var(--line);padding-top:10px}.sum .line{padding:5px 0}.sum .total{font-size:19px;font-weight:900;padding-top:12px}.paybox{margin-top:14px;display:grid;gap:10px}label{display:grid;gap:6px;font-weight:700;font-size:12px;color:#52615a}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--g)}.pay,.pri{background:linear-gradient(135deg,#635bff,#746cff);color:#fff;padding:12px 15px;border-radius:9px;font-weight:900}.danger{color:var(--red)!important}.ghost{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:9px}.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.table{overflow:auto}.table table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.kpi div{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px}.kpi small{display:block;color:var(--muted)}.kpi b{display:block;font-size:21px;margin-top:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.chart{height:190px;display:flex;gap:10px;align-items:end}.barc{flex:1;text-align:center}.barc i{display:block;background:var(--g);border-radius:7px 7px 0 0;min-height:3px}.modal{position:fixed;inset:0;background:#07140f99;display:grid;place-items:center;padding:20px;z-index:10}.md{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:20px}.hidden{display:none}.receipt{width:320px;margin:auto;font:12px ui-monospace,monospace;border:1px dashed #bbb;padding:16px;background:#fff}.receipt img{display:block;max-width:90px;max-height:65px;margin:auto}.receipt .rline{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.receipt hr{border:0;border-top:1px dashed #aaa;margin:12px 0}.mobile{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#15231d;color:#fff;padding:12px 15px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:1050px){.pos{grid-template-columns:1fr}.cart{position:static}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{display:none}.main{margin:0;width:100%;padding:15px 15px 80px}.grid,.fg,.two{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}.mobile{display:flex;position:fixed;z-index:8;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:8px}.mobile button{background:none;color:var(--muted);font-size:11px}.mobile button.on{color:var(--g);font-weight:900}.top .date{display:none}}
</style>
<style>
body{background:radial-gradient(circle at 90% 0%,#ebe9ff 0,transparent 28%),var(--bg)}
.main{padding:28px 30px}
.top{padding:2px 2px 6px}
.top h1{font-size:28px;letter-spacing:-.5px}
.card,.kpi div{box-shadow:var(--shadow)}
.search{box-shadow:0 8px 24px rgba(30,34,80,.04)}
button{transition:transform .16s ease,box-shadow .16s ease,background .16s ease}
.pri,.pay{box-shadow:0 8px 18px rgba(99,91,255,.20)}
.pri:hover,.pay:hover{transform:translateY(-1px);box-shadow:0 11px 24px rgba(99,91,255,.28)}
.ghost:hover{background:#f7f7fb}
.kpi b{letter-spacing:-.5px}
@media(max-width:700px){
 .main{margin:0;width:100%;padding:16px 14px 82px}
 .top h1{font-size:23px}
 .mobile{background:rgba(255,255,255,.94);backdrop-filter:blur(14px);box-shadow:0 -8px 24px rgba(20,22,50,.07)}
 .mobile button{padding:7px 10px}
}
</style></head>
<body>
<div class="app"><aside class="side"><div class="brand"><div class="logo"><img id="logoImg" style="display:none"><span id="logoText">K</span></div><div><b id="storeSide">NEXORA</b><small>Smart Business & POS</small></div></div><div id="nav" class="nav"></div></aside>
<main class="main"><div class="top"><div><h1 id="title">Kasir</h1><p id="subtitle">Kelola penjualan, produk, stok, dan laporan dalam satu dashboard.</p></div><div class="date" id="clock"></div></div><div id="content"></div></main></div>
<div id="mobile" class="mobile"></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div>
<script>
const KEY='kasirku_modern_v2';
const fresh=()=>({set:{name:'Kopi Senja Cafe',tel:'',addr:'Surabaya, Jawa Timur',tax:10,foot:'Terima kasih sudah berkunjung!',logo:''},products:[['Kopi Susu Gula Aren','barang','Coffee',9000,22000,40],['Americano','barang','Coffee',7000,18000,35],['Matcha Latte','barang','Non-Coffee',10000,26000,20],['Lychee Tea','barang','Tea',6000,18000,30],['French Fries','barang','Food',7000,20000,16],['Chicken Rice Bowl','barang','Food',12000,32000,12]].map(x=>({id:uid(),name:x[0],type:x[1],cat:x[2],cost:x[3],price:x[4],stock:x[5],sku:'',bom:''})),vouchers:[],sales:[],seq:1});
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const rp=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n||0);
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sm=(a,f)=>a.reduce((x,y)=>x+f(y),0), fd=d=>new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}), dk=d=>new Date(d).toISOString().slice(0,10);
let tab='pos',cart=[],q='',cat='Semua',voucher=null,search='',date='',range=7;
const tabs=[['pos','Kasir'],['prod','Produk'],['vch','Voucher'],['his','Riwayat'],['rep','Laporan'],['set','Pengaturan']];
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('show'),2200)}
function modal(h){$('#modal').innerHTML=h?'<div class="md">'+h+'</div>':'';$('#modal').classList.toggle('hidden',!h)}
function go(t){tab=t;render()}
function nav(){const make=id=>tabs.map(t=>'<button class="'+(t[0]==id?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('');$('#nav').innerHTML=make(tab);$('#mobile').innerHTML=make(tab)}
function render(){nav();$('#storeSide').textContent=S.set.name;$('#title').textContent=tabs.find(x=>x[0]==tab)[1];const li=$('#logoImg'),lt=$('#logoText');if(S.set.logo){li.src=S.set.logo;li.style.display='block';lt.style.display='none'}else{li.style.display='none';lt.style.display='block'}({pos,prod,vch,his,rep,set})[tab]()}
function categories(){return ['Semua',...new Set(S.products.map(p=>p.cat||'Umum'))]}
function pos(){$('#content').innerHTML='<div class="pos"><section><input class="search" placeholder="Cari produk atau SKU..." value="'+esc(q)+'" oninput="q=this.value;drawProducts()"><div id="chips" class="chips"></div><div id="grid" class="grid"></div></section><aside class="card cart"><div class="carthead"><div><h3>Pesanan Saat Ini</h3><span class="mu">Keranjang kasir</span></div><span class="pill">Draft</span></div><div id="items"></div><div class="row"><input id="vc" placeholder="Kode voucher"><button class="ghost" onclick="applyVoucher()">Pakai</button></div><div id="summary"></div><div class="paybox"><label>Metode pembayaran<select id="pm" onchange="updateTotal()"><option>Tunai</option><option>QRIS</option><option>Transfer</option><option>Debit</option></select></label><div id="cash"><input id="paid" type="number" placeholder="Uang diterima" oninput="updateTotal()"><div id="quick" class="chips"></div></div><div id="change" class="mu"></div><button class="pay" onclick="checkout()">Bayar & Selesaikan</button></div></aside></div>';drawProducts();drawCart()}
function drawProducts(){const cs=categories();if(!cs.includes(cat))cat='Semua';$('#chips').innerHTML=cs.map(c=>'<button class="'+(c==cat?'on':'')+'" onclick="cat='+JSON.stringify(c)+';drawProducts()">'+esc(c)+'</button>').join('');const l=S.products.filter(p=>(cat=='Semua'||p.cat==cat)&&(p.name+' '+p.sku).toLowerCase().includes(q.toLowerCase()));$('#grid').innerHTML=l.map(p=>'<button class="pc" '+(p.type=='barang'&&p.stock<=0?'disabled':'')+' onclick="add(\''+p.id+'\')"><b>'+esc(p.name)+'</b><span>'+rp(p.price)+'</span><small>'+(p.type=='jasa'?'Jasa':p.stock<=0?'Habis':'Stok '+p.stock)+'</small></button>').join('')||'<p class="mu">Belum ada produk.</p>'}
function add(id){const p=S.products.find(x=>x.id==id),i=cart.find(x=>x.id==id);if(p.type=='barang'&&(i?i.qty:0)>=p.stock)return toast('Stok tidak cukup');i?i.qty++:cart.push({id,name:p.name,price:p.price,cost:p.cost,type:p.type,qty:1});drawCart()}
function change(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);drawCart()}
function calc(){const sub=sm(cart,i=>i.price*i.qty);let d=0;if(voucher&&sub>=voucher.min)d=voucher.type=='persen'?Math.round(sub*voucher.value/100):Math.min(voucher.value,sub);const tax=Math.round((sub-d)*S.set.tax/100);return{sub,d,tax,total:sub-d+tax}}
function drawCart(){$('#items').innerHTML=cart.length?cart.map((i,n)=>'<div class="ci"><div><b>'+esc(i.name)+'</b><br><small>'+rp(i.price)+'</small></div><div class="qt"><button onclick="change('+n+',-1)">−</button><span>'+i.qty+'</span><button onclick="change('+n+',1)">+</button></div><b>'+rp(i.price*i.qty)+'</b></div>').join(''):'<p class="mu">Pilih produk untuk mulai transaksi.</p>';updateTotal()}
function updateTotal(){if(!$('#summary'))return;const c=calc();$('#summary').innerHTML='<div class="sum"><div class="line"><span>Subtotal</span><span>'+rp(c.sub)+'</span></div>'+(c.d?'<div class="line"><span>Diskon</span><span>−'+rp(c.d)+'</span></div>':'')+'<div class="line"><span>Pajak '+S.set.tax+'%</span><span>'+rp(c.tax)+'</span></div><div class="line total"><span>Total</span><span>'+rp(c.total)+'</span></div></div>';const cash=$('#pm').value=='Tunai';$('#cash').style.display=cash?'block':'none';if(cash){$('#quick').innerHTML=[c.total,20000,50000,100000].filter((x,i)=>!i||x>=c.total).map((x,i)=>'<button onclick="paid.value='+x+';updateTotal()">'+(i?'Rp'+x.toLocaleString('id-ID'):'Uang pas')+'</button>').join('');const p=+$('#paid').value||0;$('#change').textContent=p>=c.total?'Kembalian: '+rp(p-c.total):p?'Kurang: '+rp(c.total-p):''}}
function applyVoucher(){const code=$('#vc').value.trim().toUpperCase();if(!code){voucher=null;return updateTotal()}const v=S.vouchers.find(x=>x.code==code&&x.on);if(!v)return toast('Voucher tidak valid');if(v.min>calc().sub)return toast('Minimal belanja '+rp(v.min));voucher=v;updateTotal();toast('Voucher diterapkan')}
function checkout(){if(!cart.length)return toast('Keranjang masih kosong');const c=calc(),m=$('#pm').value,p=+$('#paid').value||0;if(m=='Tunai'&&p<c.total)return toast('Uang diterima kurang');const s={id:uid(),no:'INV'+String(S.seq++).padStart(5,'0'),date:new Date().toISOString(),items:cart.map(x=>({...x})),sub:c.sub,disc:c.d,tax:c.tax,total:c.total,paid:m=='Tunai'?p:c.total,change:m=='Tunai'?p-c.total:0,m,vc:c.d&&voucher?voucher.code:'',st:'ok'};s.items.forEach(i=>{const p=S.products.find(x=>x.id==i.id);if(p&&p.type=='barang')p.stock-=i.qty});S.sales.unshift(s);save();cart=[];voucher=null;render();receipt(s.id)}
function receipt(id){const s=S.sales.find(x=>x.id==id);modal('<div class="receipt">'+(S.set.logo?'<img src="'+S.set.logo+'">':'')+'<center><b>'+esc(S.set.name)+'</b><br>'+esc(S.set.addr)+'</center><hr>'+s.no+'<br>'+fd(s.date)+'<hr>'+s.items.map(i=>'<div class="rline"><span>'+esc(i.name)+'<br>'+i.qty+' × '+rp(i.price)+'</span><b>'+rp(i.qty*i.price)+'</b></div>').join('')+'<hr><div class="rline"><b>Subtotal</b><b>'+rp(s.sub)+'</b></div>'+(s.disc?'<div class="rline"><span>Diskon</span><span>−'+rp(s.disc)+'</span></div>':'')+'<div class="rline"><span>Pajak</span><span>'+rp(s.tax)+'</span></div><div class="rline"><b>TOTAL</b><b>'+rp(s.total)+'</b></div><hr><center>'+esc(S.set.foot)+'</center></div><div class="row" style="margin-top:15px"><button class="pri" onclick="printReceipt(\''+id+'\')">Cetak</button><button class="ghost" onclick="modal()">Tutup</button></div>')}
function printReceipt(id){const s=S.sales.find(x=>x.id==id),w=open('','_blank','width=420,height=700');if(!w)return toast('Izinkan popup untuk mencetak');w.document.write('<html><body style="width:320px;margin:20px auto;font:12px monospace">'+$('.receipt').outerHTML+'<script>window.print()<\/script></body></html>');w.document.close()}
function prod(){$('#content').innerHTML='<div class="bar"><div><h2>Produk & Jasa</h2><p class="mu">Kelola harga, HPP, stok, kategori dan SKU.</p></div><button class="pri" onclick="productForm()">+ Tambah Produk</button></div><div class="card table" style="margin-top:15px"><table><tr><th>Produk<th>Jenis<th>HPP<th>Harga<th>Margin<th>Stok<th>Aksi</tr>'+S.products.map(p=>'<tr><td><b>'+esc(p.name)+'</b><br><small>'+esc(p.cat)+'</small><td>'+p.type+'<td>'+rp(p.cost)+'<td>'+rp(p.price)+'<td>'+Math.round((p.price-p.cost)/p.price*100)+'%<td>'+(p.type=='jasa'?'—':p.stock)+'<td><button onclick="productForm(\''+p.id+'\')">Ubah</button> <button class="danger" onclick="delProduct(\''+p.id+'\')">Hapus</button>').join('')+'</table></div>'}
function productForm(id){const p=S.products.find(x=>x.id==id)||{type:'barang',cat:'Coffee',cost:0,price:0,stock:0};modal('<h3>'+ (id?'Ubah':'Tambah') +' Produk</h3><div class="fg"><label>Nama<input id="pn" value="'+esc(p.name||'')+'"></label><label>Jenis<select id="pt"><option value="barang">Barang</option><option value="jasa">Jasa</option></select></label><label>Kategori<input id="pc" value="'+esc(p.cat||'')+'"></label><label>SKU / Barcode<input id="psku" value="'+esc(p.sku||'')+'"></label><label>HPP<input id="pcost" type="number" value="'+p.cost+'"></label><label>Markup %<input id="pmark" type="number" value="30"></label><label>Harga jual<input id="pprice" type="number" value="'+p.price+'"></label><label>Stok<input id="pstock" type="number" value="'+p.stock+'"></label></div><label>BOM / rincian HPP<textarea id="pbom" rows="3">'+esc(p.bom||'')+'</textarea></label><div class="row" style="margin-top:15px"><button class="pri" onclick="saveProduct(\''+(id||'')+'\')">Simpan</button><button class="ghost" onclick="modal()">Batal</button></div>');$('#pt').value=p.type||'barang'}
function saveProduct(id){const n=$('#pn').value.trim(),price=+$('#pprice').value;if(!n||!price)return toast('Nama dan harga wajib diisi');const o={id:id||uid(),name:n,type:$('#pt').value,cat:$('#pc').value.trim()||'Umum',sku:$('#psku').value.trim(),cost:+$('#pcost').value||0,price,stock:+$('#pstock').value||0,bom:$('#pbom').value};const i=S.products.findIndex(x=>x.id==id);i>=0?S.products[i]=o:S.products.push(o);save();modal();render();toast('Produk disimpan')}
function delProduct(id){if(!confirm('Hapus produk ini?'))return;S.products=S.products.filter(x=>x.id!=id);save();render()}
function vch(){$('#content').innerHTML='<div class="bar"><h2>Voucher</h2></div><div class="card"><div class="fg"><label>Kode<input id="vcode"></label><label>Jenis<select id="vtype"><option value="persen">Persen</option><option value="nominal">Nominal</option></select></label><label>Nilai<input id="vval" type="number"></label><label>Minimal belanja<input id="vmin" type="number" value="0"></label></div><button class="pri" style="margin-top:12px" onclick="saveVoucher()">Buat Voucher</button></div><div class="card table" style="margin-top:15px"><table><tr><th>Kode<th>Potongan<th>Min.<th>Status<th>Aksi</tr>'+S.vouchers.map((v,i)=>'<tr><td><b>'+esc(v.code)+'</b><td>'+ (v.type=='persen'?v.value+'%':rp(v.value)) +'<td>'+rp(v.min)+'<td>'+(v.on?'Aktif':'Nonaktif')+'<td><button onclick="toggleVoucher('+i+')">Toggle</button> <button class="danger" onclick="S.vouchers.splice('+i+',1);save();render()">Hapus</button>').join('')+'</table></div>'}
function saveVoucher(){const c=$('#vcode').value.trim().toUpperCase(),v=+$('#vval').value;if(!c||!v)return toast('Kode dan nilai wajib diisi');S.vouchers.push({code:c,type:$('#vtype').value,value:v,min:+$('#vmin').value||0,on:true});save();render();toast('Voucher dibuat')}
function toggleVoucher(i){S.vouchers[i].on=!S.vouchers[i].on;save();render()}
function his(){const rows=S.sales.filter(s=>(!search||(s.no+s.m+(s.vc||'')).toLowerCase().includes(search.toLowerCase()))&&(!date||dk(s.date)==date));$('#content').innerHTML='<div class="bar"><h2>Riwayat Transaksi</h2><button class="ghost" onclick="exportCSV()">Export CSV</button></div><div class="row" style="margin:15px 0"><input placeholder="Cari nomor struk / voucher / metode" value="'+esc(search)+'" oninput="search=this.value;his()"><input type="date" value="'+date+'" onchange="date=this.value;his()"></div><div class="card table"><table><tr><th>No.<th>Waktu<th>Item<th>Total<th>Metode<th>Aksi</tr>'+rows.map(s=>'<tr><td>'+s.no+(s.st=='void'?' <small class="danger">batal</small>':'')+'<td>'+fd(s.date)+'<td>'+sm(s.items,i=>i.qty)+'<td>'+rp(s.total)+'<td>'+s.m+'<td><button onclick="receipt(\''+s.id+'\')">Struk</button> '+(s.st=='ok'?'<button class="danger" onclick="voidSale(\''+s.id+'\')">Batalkan</button>':'')).join('')+'</table></div>'}
function voidSale(id){const s=S.sales.find(x=>x.id==id);if(!s||s.st=='void')return;s.st='void';s.items.forEach(i=>{const p=S.products.find(x=>x.id==i.id);if(p&&p.type=='barang')p.stock+=i.qty});save();his()}
function exportCSV(){const rows=S.sales.map(s=>[s.no,dk(s.date),s.m,s.sub,s.disc,s.tax,s.total,s.st].join(','));modal('<textarea rows="12">'+esc('no,tanggal,metode,subtotal,diskon,pajak,total,status\n'+rows.join('\n'))+'</textarea><button class="pri" style="margin-top:10px" onclick="navigator.clipboard.writeText(document.querySelector(\'#modal textarea\').value);toast(\'CSV disalin\')">Salin</button>')}
function rep(){const ok=S.sales.filter(s=>s.st=='ok'),start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-range+1);const r=range=='all'?ok:ok.filter(s=>new Date(s.date)>=start),net=sm(r,s=>s.sub-s.disc),hpp=sm(r,s=>sm(s.items,i=>i.cost*i.qty)),lab=net-hpp;const top={};r.forEach(s=>s.items.forEach(i=>top[i.name]=(top[i.name]||0)+i.qty));const tops=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);$('#content').innerHTML='<div class="bar"><h2>Laporan</h2><div class="chips">'+[[1,'Hari ini'],[7,'7 Hari'],[30,'30 Hari'],['all','Semua']].map(x=>'<button class="'+(range==x[0]?'on':'')+'" onclick="range='+JSON.stringify(x[0])+';rep()">'+x[1]+'</button>').join('')+'</div></div><div class="kpi"><div><small>Penjualan bersih</small><b>'+rp(net)+'</b></div><div><small>Total HPP</small><b>'+rp(hpp)+'</b></div><div><small>Laba kotor</small><b>'+rp(lab)+'</b></div><div><small>Margin</small><b>'+(net?Math.round(lab/net*100):0)+'%</b></div><div><small>Transaksi</small><b>'+r.length+'</b></div><div><small>Rata-rata</small><b>'+rp(r.length?sm(r,s=>s.total)/r.length:0)+'</b></div></div><div class="two"><div class="card table"><h3>Produk Terlaris</h3><table><tr><th>Produk<th>Qty</tr>'+tops.map(x=>'<tr><td>'+esc(x[0])+'<td>'+x[1]).join('')+'</table></div><div class="card"><h3>Stok Menipis</h3>'+S.products.filter(p=>p.type=='barang'&&p.stock<=5).map(p=>'<p>'+esc(p.name)+' <b style="float:right">'+p.stock+'</b></p>').join('')||'<p class="mu">Semua stok aman.</p>'+'</div></div>'}
function set(){const s=S.set;$('#content').innerHTML='<div class="bar"><h2>Pengaturan</h2></div><div class="card"><h3>Logo & Identitas Toko</h3><p class="mu">Logo tampil di sidebar dan struk. PNG/JPG/WebP maksimal 2 MB.</p>'+(s.logo?'<img src="'+s.logo+'" style="width:110px;height:75px;object-fit:contain;border:1px dashed #bbb;border-radius:10px">':'')+'<label>Pilih logo<input type="file" accept="image/png,image/jpeg,image/webp" onchange="logo(this)"></label></div><div class="card" style="margin-top:15px"><div class="fg"><label>Nama toko<input id="sn" value="'+esc(s.name)+'"></label><label>Telepon<input id="st" value="'+esc(s.tel)+'"></label><label>Alamat<input id="sa" value="'+esc(s.addr)+'"></label><label>Pajak %<input id="sx" type="number" value="'+s.tax+'"></label></div><label>Footer struk<input id="sf" value="'+esc(s.foot)+'"></label><button class="pri" onclick="saveSet()">Simpan Pengaturan</button></div><div class="card" style="margin-top:15px"><h3>Backup & Restore</h3><textarea id="backup" rows="5" placeholder="JSON backup"></textarea><div class="row" style="margin-top:10px"><button class="ghost" onclick="backup.value=JSON.stringify(S)">Buat Backup</button><button class="ghost" onclick="navigator.clipboard.writeText(backup.value);toast('Backup disalin')">Salin</button><button class="pri" onclick="restore()">Pulihkan</button></div></div>'}
function logo(el){const f=el.files[0];if(!f)return;if(f.size>2e6)return toast('Logo maksimal 2 MB');const r=new FileReader();r.onload=()=>{S.set.logo=r.result;save();render();toast('Logo dipasang')};r.readAsDataURL(f)}
function saveSet(){S.set={...S.set,name:$('#sn').value.trim()||'Toko Saya',tel:$('#st').value.trim(),addr:$('#sa').value.trim(),tax:+$('#sx').value||0,foot:$('#sf').value.trim()};save();render();toast('Pengaturan tersimpan')}
function restore(){try{S=JSON.parse($('#backup').value);save();render();toast('Data dipulihkan')}catch(e){toast('Backup tidak valid')}}
function exportCSV(){const rows=S.sales.map(s=>[s.no,dk(s.date),s.m,s.total,s.st].join(','));modal('<textarea rows="12">'+esc('no,tanggal,metode,total,status\n'+rows.join('\n'))+'</textarea>')}
setInterval(()=>$('#clock').textContent=new Date().toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'}),1000);render();
</script></body></html>
